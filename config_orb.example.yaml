# config_orb.example.yaml — ШАБЛОН конфига робота ORB (Opening Range Breakout), Si M15.
#
# Это образец, отслеживаемый в git. Рабочий файл — config_orb.yaml — в git НЕ входит
# (см. .gitignore), правится окном и живёт только у тебя. При первой настройке:
#   copy config_orb.example.yaml config_orb.yaml   (Windows)
# затем впиши свои account/тег/депозит (или задай на вкладке «Настройки» в окне).
# Так git pull больше не будет конфликтовать из-за твоих локальных настроек.
#
# mode: backtest | paper | live
#   backtest — прогон на истории MOEX ISS, реального QUIK не требует;
#   paper    — живые данные из QUIK, заявки НЕ выставляются (только журнал) — режим по умолчанию;
#   live     — реальные заявки. Включается ТОЛЬКО live_trading: true + подтверждение "yes" при старте.
mode: paper
live_trading: false

# слот QuikPy (requests/callbacks порты) — если параллельно запускаете что-то ещё
# через QuikPy на этом же терминале, у каждого процесса должны быть свои порты
slot:
  host: 127.0.0.1
  requests_port: 34140
  callbacks_port: 34141
  connect_timeout_seconds: 6
  request_timeout_seconds: 5
  quik_py_dir: null

class_code: SPBFUT
# ACCOUNT (торговый счёт FORTS) для транзакций. Можно оставить пустым — робот тогда
# сам подставит торговый счёт, найденный в QUIK (см. пре-флайт: «Счёт для заявок …
# авто из QUIK»). Заполни явно, если счетов несколько или хочешь зафиксировать нужный.
# Формат зависит от брокера. В paper/backtest не используется.
account: ""
client_code: ""

# M15-график ЭТОГО инструмента должен быть открыт в QUIK с этим тегом (см. checklist в README);
# контракт, который туда нужно поставить, робот печатает в лог при старте (orb_calendar.active_contract).
chart_tag: si15m
tick_size: 1.0

timeframe_minutes: 15
bar_close_delay_seconds: 7
account_poll_seconds: 10   # как часто опрашивать средства счёта (вкладка «Счёт» в orb_window.py)
draw_live_labels: true     # рисовать сделки робота (вход/стоп/границы/выход) на графике QUIK в
                           # реальном времени — только чемпион, не тени. best-effort: сбой отрисовки
                           # не влияет на торговлю
clear_labels_on_start: false  # false (по умолчанию) — на старте исторические метки (бэктест/прошлые
                              # прогоны) НЕ удаляются, живые рисуются поверх; true — чистить график на старте
stop_check_seconds: 30     # пульс живости стопа (live): раз в N сек, если позиция открыта, проверить,
                           # что активный биржевой стоп существует; пропал — переставить/аварийно закрыть
stale_minutes: 25          # watchdog застоя данных: если в торговые часы последний бар старше N минут
                           # (завис график / нестабильный интернет-модем) — громкий алерт, входы на паузе
# Пре-флайт боевого старта (пункт №4): перед запуском live робот прогоняет проверки —
# связь с QUIK, фьючерсный счёт, ACCOUNT, активный контракт, совпадение графика с
# контрактом, читаемость ГО/цены пункта, kill-switch, часовой пояс (MSK). Любой FAIL
# в live = отказ торговать (в лог + алерт). Отдельных настроек нет — работает всегда.

# сверка исполнения заявок в live (пункт №1): робот читает ФАКТИЧЕСКУЮ позицию из
# QUIK (get_futures_holding) и проверяет, что вход исполнился, стоп встал, а закрытие
# реально ушло в ноль. Требует, чтобы у QuikPy работал get_futures_holding/get_stop_orders
# на твоём терминале (имена методов зависят от версии — см. дисклеймер в orb_account.py).
execution:
  verify: true                    # false — старое поведение (заявки вслепую, без сверки)
  confirm_timeout_seconds: 10     # сколько ждать подтверждения позиции после заявки
  confirm_poll_seconds: 1         # период опроса позиции
  close_retries: 3                # сколько раз повторить рыночное закрытие, если не ушло в ноль

# охрана графика: робот берёт сигналы из графика по chart_tag, а торгует контракт,
# который вычисляет сам (active_contract). Если график привязан не к тому контракту —
# сигналы и заявки разъезжаются молча. Проверка ловит это тремя способами (по убыванию
# точности): точное имя sec за тегом (если QuikPy умеет), сверка цены графика с LAST
# торгуемого контракта, свежесть последнего бара. При несоответствии — алерт + блок
# ВХОДОВ (открытая позиция ведётся штатно). Актуально для paper/live, не для бэктеста.
chart_guard:
  enabled: true
  price_tolerance_pct: 1.0        # |цена графика − LAST контракта| / LAST выше — несоответствие
  max_bar_age_minutes: 40         # последний бар графика старше — «протухший»/истёкший контракт

risk:
  risk_per_trade: 0.03
  go_fraction: 0.50
  max_stop_pt: 900.0
  daily_loss_limit: 0.02
  weekly_halt_limit: 0.05

# нюансы поведения, где эталонный Pine-скрипт (si_strategy_lab.pine) отличается
# от исходной текстовой спецификации ORB — см. разбор в ORB_README.md
strategy:
  # false (по умолчанию) — противоположный сигнал при открытой позиции игнорируется
  #   (так написано в исходной спецификации: "позиция всегда одна");
  # true  — разворот позиции противоположным свежим пробоем, как в эталонном
  #   Pine-скрипте (strategy.entry там реверсирует позицию).
  allow_position_flip: false
  # trading_days (по умолчанию) — честные +/-2 ТОРГОВЫХ дня вокруг экспирации
  #   (через выходные зона расширяется, т.к. экспирация всегда в четверг);
  # calendar_days — как в эталонном Pine-скрипте: наивные +/-2 КАЛЕНДАРНЫХ дня
  #   по номеру дня месяца, зона на 1 торговый день ýже (не доходит до понедельника).
  expiration_zone_mode: trading_days
  # безубыток: при движении на +N*R в плюс (R = |вход-стоп|) стоп переносится в цену
  # входа. 0 (по умолчанию) — выключено. В исследовании 1.0 снижал просадку ~на 17%
  # ценой ~5% прибыли (лучше доход-на-риск). ВНИМАНИЕ: в live стоп у брокера пока НЕ
  # двигается (не реализовано) — параметр работает только в backtest/paper/shadow.
  # Проверяй форвардом как shadow-вариант перед включением в live.
  breakeven_r: 0.0
  # временной EOD-страховщик: если позиция ещё открыта в это время (по ЧАСАМ, не по
  # бару) — робот закрывает её рынком и снимает стоп. Спасает от переноса позиции через
  # ночь, если бар 18:40/18:45 не пришёл (обрыв связи/зависший график): перенос на Si
  # даёт гэп-риск до −16% депозита на сделке. По умолчанию 18:44 — в основной сессии,
  # до вечернего клиринга, пока рынок ликвиден для рыночного закрытия.
  eod_flat_time: "18:44"

# депозит для расчёта размера позиции (используется, если sizing.from_live_equity=false).
# В backtest — фиксированное допущение на весь период.
deposit_rub: 300000.0

# сайзинг позиции (пункт №4): защита от мусорных чтений ГО из QUIK + опциональный
# расчёт от живого equity. Риск-лимиты (дневной/недельный) всегда считаются от
# deposit_rub — это фиксированная точка отсчёта потерь, не зависящая от чтений.
sizing:
  from_live_equity: false     # true — размер от живого equity из QUIK (по сути компаундинг);
                              # false (по умолчанию) — от deposit_rub, предсказуемо
  go_min_rub: 3000            # ГО из QUIK НИЖЕ — считаем чтение мусорным, берём go_per_contract_assumed
  go_max_rub: 100000          # ГО из QUIK ВЫШЕ — тоже фолбэк (защита от абсурдного размера)
  equity_min_rub: 10000       # equity ниже — чтение подозрительно, сайзинг от deposit_rub

# теневые варианты (live-тень, дверь Б): считаются параллельно чемпиону на ТЕХ ЖЕ
# барах, но с фильтром входа и в СВОИ журналы (logs/shadow_<name>_trades.csv и т.д.),
# и НИКОГДА не шлют заявки. Форвард-тест любой идеи фильтра без риска капиталом —
# копишь журналы месяцами и сравниваешь с чемпионом. Пусто по умолчанию.
# Фильтр (все поля опциональны): min_rel_volume / max_rel_volume — по относительному
# объёму пробойного бара; entry_before '15:00' — не входить после времени;
# range_min / range_max — по ширине утреннего диапазона (пунктов); regime_min /
# regime_max — по режиму волатильности (трейлинг отн. дневной диапазон за 10 дней, %:
# напр. regime_max: 2.0 — не входить, когда рынок в высоковолатильном режиме).
# Кроме фильтра входа, вариант может задавать breakeven_r (безубыток после +N*R) —
# так тень форвард-тестит управление сделкой, а не только фильтрацию входов.
shadow_variants: []
# пример (в т.ч. кандидаты из исследования):
# shadow_variants:
#   - name: be1            # безубыток после +1R — форвард-тест снижения просадки
#     breakeven_r: 1.0
#   - name: regime2        # стоять в высоковолатильном режиме
#     filter: {regime_max: 2.0}

backtest:
  date_from: "2025-07-11"
  date_till: "2026-07-10"
  cache_dir: "data_cache/moex_m15"
  # deposit_rub: 300000.0   # необязательное переопределение ТОЛЬКО для бэктеста;
  #                           если закомментировано — берётся общий deposit_rub выше
  #                           (тот, что задаётся на вкладке «Настройки» в окне)
  rub_per_point: 1.0            # Si: 1 пункт = 1 ₽ (фикс.)
  go_per_contract_assumed: 12000.0   # ПРЕДПОЛОЖЕНИЕ — реальное ГО плавает, см. README
  commission_per_side_rub: 5.0
  slippage_ticks: 2

paths:
  trades_csv: logs/orb_trades.csv
  skips_csv: logs/orb_skips.csv
  risk_state_json: logs/orb_risk_state.json
  backtest_trades_csv: logs/orb_backtest_trades.csv   # сделки ПОСЛЕДНЕГО прогона (перезапись)
  backtest_runs_csv: logs/orb_backtest_runs.csv       # история прогонов (накапливается)
  log_dir: logs

kill_switch_dir: "."   # наличие файла STOP в этой директории -> немедленная остановка

window_geometry: "820x680+60+60"   # запоминается автоматически при сохранении настроек в orb_window.py
